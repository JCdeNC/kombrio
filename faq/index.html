<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kombrio · Perguntas frequentes</title>
  <meta name="description" content="Perguntas frequentes sobre a Kombrio: estabelecimentos, guias, Tour Companies, agências e turistas.">
  <meta name="theme-color" content="#102C38">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .fq-wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
    .fq-langs { display: flex; gap: 6px; flex-wrap: wrap; }
    .fq-langs a { padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; text-decoration: none; color: var(--ink); font-size: .85rem; }
    .fq-langs a.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .fq-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0; }
    .fq-tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font: inherit; cursor: pointer; }
    .fq-tabs button.on { background: var(--brand); color: #fff; border-color: var(--brand); }
    .fq-cta { display: grid; gap: 8px; margin-top: 18px; }
    .fq-cta a { text-align: center; text-decoration: none; }
  </style>
</head>
<body>
  <!-- KOMBRIO v104 : FAQ publique. Même texte que l'Aide des applications (js/faq.js). -->
  <header class="top">
    <span class="brand"><img src="../icon.svg" alt=""><span class="brand-word">kombrio<i></i></span><span class="brand-app" id="fq-app">FAQ</span></span>
  </header>
  <main class="fq-wrap" id="fq"></main>
  <script type="module">
    import { FAQ, faqList, faqTitle } from '../js/faq.js';
    const LANGS = ['pt', 'fr', 'en', 'es', 'de'];
    const UI = {
      pt: { title: 'Perguntas frequentes', cta: 'Começar', partner: 'Cadastrar meu estabelecimento', guide: 'Ser guia Kombrio', company: 'Cadastrar minha empresa (Tour Company / Agência)', demo: 'Ver a demonstração', other: 'Já usa a Kombrio? Toque em «Ajuda» no aplicativo: a resposta ou a equipe Kombrio estão lá.', ptonly: '' },
      fr: { title: 'Questions fréquentes', cta: 'Commencer', partner: 'Inscrire mon établissement', guide: 'Devenir guide Kombrio', company: 'Inscrire mon entreprise (Tour Company / agence)', demo: 'Voir la démonstration', other: "Vous utilisez déjà Kombrio ? Touchez « Aide » dans l'application : la réponse ou l'équipe Kombrio s'y trouvent.", ptonly: '' },
      en: { title: 'Frequently asked questions', cta: 'Get started', partner: 'Register my venue', guide: 'Become a Kombrio guide', company: 'Register my company (Tour Company / agency)', demo: 'See the demo', other: 'Already using Kombrio? Tap "Help" in the app: the answer or the Kombrio team are there.', ptonly: 'Answers for venues are in Portuguese.' },
      es: { title: 'Preguntas frecuentes', cta: 'Empezar', partner: 'Registrar mi establecimiento', guide: 'Ser guía Kombrio', company: 'Registrar mi empresa (Tour Company / agencia)', demo: 'Ver la demostración', other: '¿Ya usa Kombrio? Toque «Ayuda» en la app: allí está la respuesta o el equipo Kombrio.', ptonly: 'Las respuestas para establecimientos están en portugués.' },
      de: { title: 'Häufige Fragen', cta: 'Loslegen', partner: 'Mein Lokal registrieren', guide: 'Kombrio-Guide werden', company: 'Mein Unternehmen registrieren (Tour Company / Agentur)', demo: 'Demo ansehen', other: 'Sie nutzen Kombrio schon? Tippen Sie in der App auf „Hilfe“: Dort finden Sie die Antwort oder das Kombrio-Team.', ptonly: 'Antworten für Lokale sind auf Portugiesisch.' },
    };
    const qs = new URLSearchParams(location.search);
    const nav = (navigator.language || 'pt').slice(0, 2);
    let lang = LANGS.includes(qs.get('lang')) ? qs.get('lang') : (LANGS.includes(nav) ? nav : 'pt');
    let sec = ['partner', 'guide', 'client'].includes(qs.get('s')) ? qs.get('s') : 'partner';
    const root = document.getElementById('fq');
    function draw() {
      const u = UI[lang];
      document.documentElement.lang = lang === 'pt' ? 'pt-BR' : lang;
      document.title = 'Kombrio · ' + u.title;
      const link = (href, label, cls) => `<a class="btn ${cls}" href="${href}">${label}</a>`;
      const cta = sec === 'partner' ? link('../partner/#/parceria', u.partner, '') + link('../demo/', u.demo, 'secondary')
        : sec === 'guide' ? link('../guide/', u.guide, '') + link('../guide/#/?empresa', u.company, 'secondary') : '';
      root.innerHTML = `<div class="spread" style="flex-wrap:wrap;gap:8px"><h1 style="margin:0">${u.title}</h1>
          <nav class="fq-langs">${LANGS.map((l) => `<a href="#" data-l="${l}" class="${l === lang ? 'on' : ''}">${l.toUpperCase()}</a>`).join('')}</nav></div>
        <div class="fq-tabs" role="tablist">${Object.keys(FAQ).map((k) => `<button type="button" role="tab" data-s="${k}" class="${k === sec ? 'on' : ''}" aria-selected="${k === sec}">${faqTitle(k, lang)}</button>`).join('')}</div>
        ${sec === 'partner' && !['pt', 'fr'].includes(lang) && u.ptonly ? `<p class="hint">${u.ptonly}</p>` : ''}
        ${faqList(sec, lang)}
        ${cta ? `<div class="fq-cta">${cta}</div>` : ''}
        <p class="hint" style="margin-top:20px">${u.other}</p>`;
      root.querySelectorAll('[data-l]').forEach((a) => { a.onclick = (e) => { e.preventDefault(); lang = a.dataset.l; save(); draw(); }; });
      root.querySelectorAll('[data-s]').forEach((b) => { b.onclick = () => { sec = b.dataset.s; save(); draw(); }; });
    }
    function save() { try { history.replaceState(null, '', `?lang=${lang}&s=${sec}`); } catch (e) { /* rien */ } }
    draw();
  </script>
</body>
</html>
