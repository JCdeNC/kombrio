<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kombrio · Verificação do guia</title>
  <meta name="theme-color" content="#102C38">
  <meta name="robots" content="noindex">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/style.css">
  <!-- v82 : navigateur trop ancien (iOS < 13.4, Chrome < 80) : message clair au lieu d'une page blanche. -->
  <script>
    (function () {
      var ok = true;
      try { new Function('var a = {}; return a?.b ?? 1;')(); } catch (e) { ok = false; }
      if (!('noModule' in document.createElement('script'))) ok = false;
      if (ok) return;
      document.addEventListener('DOMContentLoaded', function () {
        var el = document.getElementById('app');
        if (el) el.innerHTML = '<div style="max-width:460px;margin:40px auto;padding:20px;font:16px/1.5 -apple-system,Arial,sans-serif;color:#12303A;border:1px solid #D9E6E9;border-radius:14px">'
          + '<b>Kombrio</b><br><br>PT · Este navegador é antigo demais. Atualize o sistema do celular ou abra o link no Chrome.'
          + '<br><br>FR · Ce navigateur est trop ancien. Mettez à jour le téléphone ou ouvrez le lien dans Chrome.'
          + '<br><br>EN · This browser is too old. Update your phone or open the link in Chrome.'
          + '<br><br>ES · Este navegador es demasiado antiguo. Actualice el teléfono o abra el enlace en Chrome.'
          + '<br><br>DE · Dieser Browser ist zu alt. Aktualisieren Sie das Telefon oder öffnen Sie den Link in Chrome.</div>';
      });
    })();
  </script>
  <script>window.KOMBRIO_APP = 'verify';</script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="../js/app.js"></script>
</body>
</html>
